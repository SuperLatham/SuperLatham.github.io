<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deckbuilder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>デッキ作成補助君</h1>
        <div class="controls">
            <div class="file-input-container">
                <input type="file" id="file-input" accept="image/*" style="display:none;">
                <div id="image-preview" tabindex="0" style="cursor:pointer;"></div>
            </div>
            <button id="decode-button">実行</button>
        </div>
        <div id="result"></div>
    </div>
    <script src="qr/jsQR.js"></script>
    <script src="qr/qrDecoder.js"></script>
    <script src="app.js"></script>
</body>
</html>
