  <h1>紅白戦開催補助君</h1>
  <div class="mb-10">
    <label for="team-switch" class="team-switch-label">
      <div class="team-switch-wrap">
        <input type="checkbox" name="team-switch" id="team-switch" class="team-switch" checked="checked">
        <div class="team-switch-circle"></div>
        <div class="team-switch-base"></div>
      </div>
      <span class="team-switch-title">自動チーム分け</span>
    </label>
  </div>
  <div id="input" class="mb-10">
    <table id="tbl">
      <tbody>
        <tr>
          <th>名前</th>
          <th>ガチ度</th>
          <th>時間</th>
          <th class="team-col" style="display: none;">チーム</th>
          <th></th>
        </tr>
        <tr>
          <th>
            <input type="text" id="name" class="name0" autocomplete="off">
          </th>
          <th>
            <input type="number" id="gati" class="gati0" min="1" max="5" value="5">
          </th>
          <th>
            <select name="team" id="time" class="time0">
              <option value="2" selected="selected">早め</option>
              <option value="1">普通</option>
              <option value="0">遅め</option>
            </select>
          </th>
          <th class="team-col" style="display: none;">
            <select name="team" id="team" class="team0">
              <option value="0" selected="selected">チームA</option>
              <option value="1">チームB</option>
            </select>
          </th>
          <th><button class="del">削除</button></th>
        </tr>
        <tr>
          <th><input type="text" id="name" class="name1" autocomplete="off"></th>
          <th> <input type="number" id="gati" class="gati1" min="1" max="5" value="5"></th>

            </select></th>
          <th class="team-col" style="display: none;"><select name="team" id="team" class="team1">
              <option value="0" selected="selected">チームA</option>
              <option value="1">チームB</option>
            </select></th>
          <th><button class="del">削除</button></th>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="mt-10">
    <button id="add" class="add">参加者を追加</button>
    <button id="submit">対戦表を生成</button>
    <button id="reSubmit">追加参加者分を生成</button>
  </div>
  <div id="output" class="mt-10">
    <div>
      <table>
        <tbody>
          <tr>
            <th>名前</th>
            <th>ガチ度</th>
            <th>時間</th>
          </tr>
          <tr>
            <th></th>
            <th>5</th>
            <th>早め</th>
          </tr>
        </tbody>
      </table>
    </div>
    <div>
      <table>

            <th>早め</th>
            <th>5</th>
            <th></th>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
